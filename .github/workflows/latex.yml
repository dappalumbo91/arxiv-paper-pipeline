name: LaTeX build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Paper 02 currently has a Markdown ```bash fence inside the .tex
    # (reproducibility section, ~line 324) which stops pdflatex with
    # "Missing $ inserted". It is reported here but does not fail the
    # workflow until the manuscript is fixed; remove `known_broken` then.
    continue-on-error: ${{ matrix.known_broken }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: template
            dir: _template
            tex: paper.tex
            known_broken: false
          - name: paper 01
            dir: papers/01-fsot-formal-contested-cosmology
            tex: 01-fsot-formal-contested-cosmology.tex
            known_broken: false
          - name: paper 01 (arxiv_upload)
            dir: papers/01-fsot-formal-contested-cosmology/arxiv_upload
            tex: 01-fsot-formal-contested-cosmology.tex
            known_broken: false
          - name: paper 02 (known LaTeX error)
            dir: papers/02-fsot-fuel-lab-formal
            tex: 02-fsot-fuel-lab-formal.tex
            known_broken: true
          - name: paper 02 arxiv_upload (known LaTeX error)
            dir: papers/02-fsot-fuel-lab-formal/arxiv_upload
            tex: 02-fsot-fuel-lab-formal.tex
            known_broken: true
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (minimal set)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern cm-super latexmk
      - name: Build (pdflatex + bibtex, halt on error)
        working-directory: ${{ matrix.dir }}
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error "${{ matrix.tex }}"
